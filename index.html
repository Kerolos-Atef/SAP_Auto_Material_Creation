<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Spare Parts & Consumables Request</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;600;700&display=swap">
<style>
/* Layout: a company paper form — bordered header block, numbered sections, ruled line-item grid, plain footer. */
:root{
  --flamingo:#F05323;
  --spice:#FFFCED;
  --tiber:#053030;
  --bg:var(--spice);
  --paper:#FFFCED;
  --pop:#FFFCED;
  --fg:var(--tiber);
  --muted:rgba(5,48,48,.62);
  --rule:var(--tiber);
  --hair:rgba(5,48,48,.28);
  --cellbg:rgba(5,48,48,.035);
  --thbg:#F6F5E6;
  --hover:rgba(5,48,48,.08);
  --accent:var(--flamingo);
  --on-accent:var(--spice);
  --ar:"Noto Kufi Arabic","Helvetica Neue",Tahoma,Arial,sans-serif;
  --latin:"Helvetica Neue",Helvetica,Arial,"Noto Kufi Arabic",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:var(--tiber);--paper:#053030;--pop:#0b3b3b;--fg:var(--spice);--muted:rgba(255,252,237,.66);--rule:var(--spice);
  --hair:rgba(255,252,237,.3);--cellbg:rgba(255,252,237,.05);--thbg:#123A39;--hover:rgba(255,252,237,.1);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:var(--tiber);--paper:#053030;--pop:#0b3b3b;--fg:var(--spice);--muted:rgba(255,252,237,.66);--rule:var(--spice);
  --hair:rgba(255,252,237,.3);--cellbg:rgba(255,252,237,.05);--thbg:#123A39;--hover:rgba(255,252,237,.1);color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:13.5px/1.7 var(--ar);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet{max-width:960px;margin:0 auto;padding-block:24px 40px}
.ltr{direction:ltr;unicode-bidi:isolate;font-family:var(--latin)}
h1,h2,h3{margin:0;font-family:var(--ar)}

/* header block */
.hdr{display:grid;grid-template-columns:1.2fr 2fr 1.2fr;border:1.5px solid var(--rule)}
.hdr > div{padding:10px 12px;min-width:0}
.hdr .co{border-left:1px solid var(--rule);display:flex;flex-direction:column;justify-content:center}
.hdr .co{gap:6px;align-items:flex-start}
.hdr .logo{display:block;width:150px;max-width:100%;height:auto}
.hdr .co span{font-size:12px;color:var(--muted)}
.hdr .ttl{border-left:1px solid var(--rule);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.hdr h1{font-size:18px;font-weight:700;line-height:1.4}
.hdr .ttl span{font-size:12px;color:var(--muted)}
.hdr dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 8px;font-size:12.5px;align-content:center}
.hdr dt{color:var(--muted)}
.hdr dd{margin:0;font-family:var(--latin);direction:ltr;text-align:right}
@media (max-width:640px){.hdr{grid-template-columns:1fr}.hdr .co,.hdr .ttl{border-left:0;border-bottom:1px solid var(--rule)}}

/* sections */
.sec{margin-top:22px}
.sec > h2{font-size:14px;font-weight:700;padding:5px 10px;border:1.5px solid var(--rule);border-bottom:0;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sec > h2 small{font-weight:400;font-size:12px;color:var(--muted)}
.box{border:1.5px solid var(--rule)}
.fields{display:grid;grid-template-columns:repeat(3,1fr)}
.fields .f{border-left:1px solid var(--hair);border-bottom:1px solid var(--hair);padding:6px 10px 8px;min-width:0}
.fields .f:nth-child(3n){border-left:0}
.fields .f.full{grid-column:1/-1;border-left:0;border-bottom:0}
@media (max-width:640px){.fields{grid-template-columns:1fr}.fields .f{border-left:0}}
label,.lbl{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:2px}
.req{color:var(--accent)}
.opt{font-weight:400;color:var(--muted);font-size:11px}
input,textarea{font:13.5px/1.5 var(--ar);color:var(--fg);background:transparent;border:0;border-bottom:1px solid var(--hair);border-radius:0;padding:4px 2px;width:100%;min-width:0}
textarea{resize:vertical;min-height:52px;border:1px solid var(--hair);padding:6px}
select{font:13.5px/1.5 var(--ar);color:var(--fg);background:transparent;border:0;border-bottom:1px solid var(--hair);border-radius:0;padding:4px 2px;width:100%;min-width:0}
select:focus{outline:0;border-color:var(--fg);background:var(--cellbg)}
select.bad{border-color:var(--accent);background:rgba(240,83,35,.08)}
select option{background:var(--pop);color:var(--fg)}
input:focus,textarea:focus{outline:0;border-color:var(--fg);background:var(--cellbg)}
button:focus-visible{outline:2px solid var(--fg);outline-offset:1px}
input.bad{border-color:var(--accent);background:rgba(240,83,35,.08)}

.types{display:flex;flex-wrap:wrap;gap:6px 36px;padding:10px 12px}
.type-opt{display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--fg);font-size:14px;font-weight:600;margin:0}
.type-opt input{appearance:none;width:16px;height:16px;border:1.5px solid var(--rule);border-radius:0;margin:0;padding:0;display:grid;place-items:center;background:transparent}
.type-opt input:checked::after{content:"";width:8px;height:8px;background:var(--fg)}
.type-opt input:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.type-opt small{font:12px var(--latin);color:var(--muted);direction:ltr;font-weight:400}

/* line-item grid */
.tbl-wrap{overflow-x:auto;border:1.5px solid var(--rule);background:var(--paper);-webkit-overflow-scrolling:touch}
table.items{border-collapse:collapse;width:max-content;min-width:100%;font-size:13.5px}
.items th,.items td{border:1px solid var(--hair)}
.items tr > :first-child{border-right:0}.items tr > :last-child{border-left:0}
.items thead th{border-top:0}
.items th{font:600 12px/1.35 var(--ar);color:var(--fg);text-align:right;padding:7px 6px;background:var(--thbg);white-space:nowrap;vertical-align:bottom;border-bottom:1.5px solid var(--rule)}
.items th .opt{display:block;font-size:10.5px}
.items td{padding:0;vertical-align:top;background:var(--paper)}
.items tbody tr:last-child td{border-bottom:0}
.items td input{border:0;padding:7px 8px;font-size:13.5px}
.items td input:focus{background:var(--cellbg);box-shadow:inset 0 -2px 0 var(--fg)}
.items .c-n{position:sticky;right:0;z-index:1;width:36px;text-align:center;font:600 12.5px/2.6 var(--latin);font-variant-numeric:tabular-nums;color:var(--muted);background:var(--thbg)}
.items td.c-n{background:var(--paper)}
.items .c-desc{position:sticky;right:36px;z-index:1}
.items th.c-n,.items th.c-desc{z-index:2}
.items .count{display:block;text-align:left;font:10.5px var(--mono);font-variant-numeric:tabular-nums;color:var(--muted);padding:0 6px 3px}
.items .count.over{color:var(--accent);font-weight:700}
.items td.bad{background:rgba(240,83,35,.09)}
.items td.bad input{box-shadow:inset 0 -2px 0 var(--accent)}
.items tr.bad-row .c-n{color:var(--accent)}
.items .c-act{white-space:nowrap;padding:3px 4px;vertical-align:middle}
.lnk{border:0;background:none;color:var(--muted);font:12px var(--ar);padding:3px 5px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.lnk:hover{color:var(--fg)}
.lnk:disabled{opacity:.35;cursor:default;text-decoration:none}
.under{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 0 0}
.small{font-size:12px;color:var(--muted)}

/* searchable dropdown */
.cb-wrap{position:relative}
.cb{padding-left:22px !important;cursor:text}
.cb-wrap::after{content:"";position:absolute;left:9px;top:50%;border:4px solid transparent;border-top-color:var(--muted);transform:translateY(-25%);pointer-events:none}
#cbPop{position:fixed;z-index:50;background:var(--pop);border:1.5px solid var(--rule);max-height:260px;overflow:auto;padding:0;margin:0;list-style:none;min-width:220px;font-family:var(--ar)}
#cbPop li{padding:6px 10px;cursor:pointer;display:flex;gap:10px;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--hair)}
#cbPop li:last-child{border-bottom:0}
#cbPop li .c{font:600 13px var(--latin);direction:ltr}
#cbPop li .d{font-size:12px;color:var(--muted);text-align:left}
#cbPop li[aria-selected="true"],#cbPop li:hover{background:var(--hover)}
#cbPop .empty{color:var(--muted);cursor:default;font-size:12px}

button{font:600 13.5px/1 var(--ar);border-radius:2px;cursor:pointer;padding:9px 16px;border:1.5px solid var(--rule);background:transparent;color:var(--fg)}
button:hover{background:var(--hover)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
button.primary:hover{filter:brightness(1.05)}
button:disabled{opacity:.5;cursor:not-allowed}
.row-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.paste{margin-top:10px;font-size:12.5px}
.paste summary{cursor:pointer;color:var(--muted);text-decoration:underline;text-underline-offset:3px;width:max-content}
.paste p{margin:6px 0;color:var(--muted)}
.paste textarea{min-height:90px}

.foot{margin-top:22px;border-top:1.5px solid var(--rule);padding-top:12px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.foot .sum{font-size:13px;color:var(--muted)}
.foot .sum b{font:600 14px var(--latin);color:var(--fg)}

.msg{border:1.5px solid var(--rule);padding:10px 12px;margin-top:16px}
.msg.error{border-color:var(--accent)}
.msg h3{font-size:14px;margin-bottom:2px}
.msg p{margin:0}
.ref{font:700 17px/1.3 var(--mono);direction:ltr;text-align:right;overflow-wrap:anywhere}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>

  });
  linesEl.addEventListener("input", e => {
    if (e.target.classList.contains("cb") && e.isTrusted) { e.target.dataset.value = ""; openCb(e.target, false); }
    const row = e.target.closest("tr");
    if (row && row.classList.contains("bad-row")) showErrors(row, lineErrors(readLine(row)));
    refresh();
  });
  linesEl.addEventListener("keydown", e => {
    const t = e.target;
    if (t.classList.contains("cb") && !pop.hidden && cbInp === t) {
      if (e.key === "ArrowDown") { e.preventDefault(); moveSel(1); return; }
      if (e.key === "ArrowUp") { e.preventDefault(); moveSel(-1); return; }
      if (e.key === "Escape") { e.preventDefault(); closeCb(); return; }
      if (e.key === "Enter" && cbIdx >= 0) { e.preventDefault(); pick(cbIdx); }
      else if (e.key === "Enter" && cbItems.length === 1) { e.preventDefault(); pick(0); }
    } else if (t.classList.contains("cb") && e.key === "ArrowDown") { e.preventDefault(); openCb(t, true); return; }
    if (e.key !== "Enter" || !t.matches("[data-k]")) return;
    e.preventDefault();
    const row = t.closest("tr");
    const ins = [...row.querySelectorAll("[data-k]")];
    const idx = ins.indexOf(t);
    if (idx === ins.length - 1 || e.ctrlKey || e.metaKey) (row.nextElementSibling || addLine(blank(), row)).querySelector('[data-k="desc"]').focus();
    else ins[idx + 1].focus();
  });
  $("#addLine").addEventListener("click", () => addLine(blank()).querySelector('[data-k="desc"]').focus());
  ["reqBy","email","dept","notes"].forEach(id => ["input","change"].forEach(ev => $("#" + id).addEventListener(ev, e => { e.target.classList.remove("bad"); saveDraft(); })));

  // ---- paste from Excel
  $("#pasteBtn").addEventListener("click", () => {
    const keys = cfg().keys;
    const rows = $("#pasteArea").value.replace(/\r/g, "").split("\n").filter(r => r.trim()).map(r => r.split("\t").map(c => c.trim()));
    if (rows.length && /desc|وصف/i.test(rows[0][0] || "")) rows.shift();
    if (!rows.length) { $("#pasteMsg").textContent = "لا يوجد ما يُضاف. انسخ السطور من Excel أولاً."; return; }
    const cur = [...linesEl.children];
    if (cur.length === 1 && isEmpty(readLine(cur[0]))) cur[0].remove();
    rows.forEach(c => { const o = {}; keys.forEach((k, i) => o[k] = c[i] || ""); addLine(o); });
    const long = rows.filter(c => (c[0] || "").length > MAX).length;
    const unmatched = linesEl.querySelectorAll("input.cb[data-bad]").length;
    $("#pasteMsg").textContent = `تمت إضافة ${plural(rows.length)}.` + (long ? ` ${long} وصف أطول من 40 حرفاً.` : "") + (unmatched ? ` ${unmatched} قيمة غير موجودة في قوائم SAP وتحتاج اختياراً يدوياً.` : "");
    $("#pasteArea").value = "";
  });

  // ---- draft (this browser only)
  function saveDraft() {
    try {
      const s = {...store, [type]: readAll()};
      localStorage.setItem(DRAFT, JSON.stringify({reqBy:$("#reqBy").value, email:$("#email").value, dept:$("#dept").value, notes:$("#notes").value, type, lines:s}));
    } catch (_) {}
  }
  function loadDraft() {
    let d = null;
    try { d = JSON.parse(localStorage.getItem(DRAFT) || "null"); } catch (_) {}
    if (d) {
      ["reqBy","email","dept","notes"].forEach(k => $("#" + k).value = d[k] || "");
      if (d.lines) { store.SP = d.lines.SP || null; store.CN = d.lines.CN || null; }
    }
    setType(d && TYPES[d.type] ? d.type : "SP", true);
  }
  function resetForm(keepPerson) {
    const keep = {reqBy:$("#reqBy").value, email:$("#email").value, dept:$("#dept").value};
    $("#form").reset();
    if (keepPerson) Object.entries(keep).forEach(([k, v]) => $("#" + k).value = v);
    store.SP = store.CN = null; pending = null; resetSubmit();
    setType(type, true);
  }
  let clearArmed = false;
  $("#clearBtn").addEventListener("click", e => {
    if (!clearArmed) { clearArmed = true; e.target.textContent = "تأكيد المسح"; setTimeout(() => { clearArmed = false; e.target.textContent = "مسح"; }, 3000); return; }
    clearArmed = false; e.target.textContent = "مسح"; resetForm(false); banner(null);
  });

  // ---- messages
  function banner(kind, html) {
    const b = $("#banner");
    if (!kind) { b.hidden = true; b.innerHTML = ""; return; }
    b.className = "msg " + kind; b.innerHTML = html; b.hidden = false;
    b.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start"});
  }
  function errText(err) {
    const c = err && err.code;
    switch (c) {
      case "server_not_connected": return "موصّل Airtable غير مضاف لحسابك على Claude. أضفه من إعدادات claude.ai ← Connectors ثم أعد الإرسال.";
      case "needs_reauth": return "انتهت صلاحية اتصال Airtable. أعد ربطه من إعدادات claude.ai ← Connectors ثم أعد الإرسال.";
      case "selection_required": return "لديك أكثر من موصّل Airtable. اختر واحداً عندما يطلب Claude ذلك ثم أعد الإرسال.";
      case "not_in_manifest": case "approval_required": case "consent_required": return "النموذج يحتاج إذنك للكتابة في Airtable. أعد الإرسال واختر Allow عند السؤال.";
      case "blocked_by_policy": return "إعدادات المؤسسة تمنع هذا النموذج من الكتابة في Airtable. تواصل مع مسؤول Claude.";
      case "tool_error": return "رفض Airtable البيانات: <span class=\"ltr\">" + esc((err.message || "").slice(0, 300)) + "</span> تأكد أن لديك صلاحية تعديل على قاعدة SAP.";
      case "server_unavailable": case "upstream_error": return "لم يرد Airtable. ربما حُفظت البيانات وربما لا. راجع جدول الطلبات في Airtable قبل إعادة الإرسال.";
      case "not_granted": case "capability_disabled": case "capability_removed": return "لا يمكن الوصول إلى Airtable من هنا. افتح النموذج من claude.ai.";
      default: return "فشل الإرسال (" + esc(c || "unknown") + "). " + esc(err && err.message || "");
    }
  }
  function idsFrom(result) {
    const p = result && result.payload;
    if (p && Array.isArray(p.records)) return p.records.map(r => r && r.id).filter(Boolean);
    return (JSON.stringify(p != null ? p : result) || "").match(/rec[A-Za-z0-9]{14}/g) || [];
  }
  function makeRef() {
    const d = new Date(), z = n => String(n).padStart(2, "0");
    return `${type === "SP" ? "SPR" : "CNR"}-${d.getFullYear()}${z(d.getMonth()+1)}${z(d.getDate())}-${z(d.getHours())}${z(d.getMinutes())}-${Math.random().toString(36).slice(2, 5).toUpperCase()}`;
  }
  const today = () => { const d = new Date(), z = n => String(n).padStart(2,"0"); return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`; };

  // ---- submit
  const submitBtn = $("#submitBtn");
  function resetSubmit() { submitBtn.textContent = "إرسال الطلب"; document.querySelectorAll('input[name="mtype"]').forEach(r => r.disabled = false); }

  async function submitViaFlow(reqBy, email, dept, rows) {
    const c = cfg(), lines = rows.map(readLine), ref = makeRef();
    const bf = {[B.ref]: ref, [B.by]: reqBy, [B.email]: email, [B.dept]: dept, [B.count]: lines.length, [B.type]: c.sap};
    if ($("#notes").value.trim()) bf[B.notes] = $("#notes").value.trim();
    const lf = lines.map(o => {
      const f = {[L.type]: c.sap, [L.by]: reqBy, [L.email]: email, [L.date]: today(), [L.status]: "Submitted"};
      c.keys.forEach(k => { if (o[k]) f[L[k]] = o[k]; });
      return f;
    });
    submitBtn.disabled = true; submitBtn.textContent = "جارٍ الإرسال…";
    document.querySelectorAll('input[name="mtype"]').forEach(r => r.disabled = true);
    try {
      const payload = JSON.stringify({ref, batch: bf, lines: lf});
      let res = null;
      try { res = await fetch(FLOW_URL, {method: "POST", headers: {"Content-Type": "application/json"}, body: payload}); }
      catch (_) {
        // browser blocked reading the reply (CORS): send as a simple request instead; the reply can't be read but the data is delivered
        await fetch(FLOW_URL, {method: "POST", mode: "no-cors", headers: {"Content-Type": "text/plain;charset=UTF-8"}, body: payload});
      }
      if (res && !res.ok) throw new Error("HTTP " + res.status);
      resetSubmit();
      $("#hdrRef").textContent = ref;
      banner("ok", `<h3>تم الإرسال</h3><p class="ref">${esc(ref)}</p><p>${plural(lines.length)} (<span class="ltr">${esc(c.sap)}</span>). تُكتب أكواد SAP في الطلب بعد المراجعة والإنشاء.</p><div class="row-actions" style="margin-top:6px"><button type="button" id="newReq">بدء طلب جديد</button></div>`);
      $("#newReq").addEventListener("click", () => { resetForm(true); banner(null); $("#hdrRef").textContent = "يصدر عند الإرسال"; window.scrollTo(0, 0); });
      store[type] = null; try { localStorage.removeItem(DRAFT); } catch (_) {}
    } catch (err) {
      resetSubmit();
      banner("error", `<h3>لم يتم الإرسال</h3><p>تعذر الوصول لخادم الإرسال (<span class="ltr">${esc(err.message || err)}</span>). تحقق من الاتصال بالإنترنت ثم أعد المحاولة. إذا تكررت المشكلة راجع البحث والتطوير قبل إعادة الإرسال حتى لا يتكرر الطلب.</p>`);
    } finally { submitBtn.disabled = false; }
  }

  submitBtn.addEventListener("click", async () => {
    banner(null); closeCb();
    const reqBy = $("#reqBy").value.trim(), dept = $("#dept").value.trim(), email = $("#email").value.trim();
    const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    let firstBad = null;
    [["reqBy", !!reqBy], ["email", emailOk], ["dept", !!dept]].forEach(([id, ok]) => { $("#" + id).classList.toggle("bad", !ok); if (!ok && !firstBad) firstBad = $("#" + id); });
    [...linesEl.children].forEach(r => { if (linesEl.children.length > 1 && isEmpty(readLine(r))) r.remove(); });
    const rows = [...linesEl.children];
    rows.forEach(r => { const e = lineErrors(readLine(r)); showErrors(r, e); if (Object.keys(e).length && !firstBad) firstBad = r.querySelector("td.bad input"); });
    refresh();
    if (firstBad) {
      const req = cfg().required.map(k => COLS[k].label).join("، ");
      banner("error", `<h3>الطلب غير مكتمل</h3><p>راجع الخانات المظللة. المطلوب في كل سطر: ${esc(req)}. الوصف 40 حرفاً كحد أقصى، والقيم المنسدلة من قوائم SAP فقط.</p>`);
      firstBad.focus(); return;
    }
    // inside claude.ai: write through the viewer's Airtable connector; elsewhere (GitHub Pages): post to the Power Automate flow
    const mcp = (window.claude && typeof window.claude.use === "function") ? await window.claude.use("mcp") : null;
    if (!mcp && !FLOW_URL) { banner("error", "<h3>الإرسال غير متاح حالياً</h3><p>رابط الإرسال لم يُضبط بعد. تواصل مع البحث والتطوير.</p>"); return; }
    if (!mcp) return submitViaFlow(reqBy, email, dept, rows);

    const c = cfg();
    submitBtn.disabled = true; submitBtn.textContent = "جارٍ الإرسال…";
    document.querySelectorAll('input[name="mtype"]').forEach(r => r.disabled = true);
    const lines = rows.map(readLine);
    let batchId = pending && pending.batchId, ref = pending && pending.ref;
    const toSend = pending ? pending.remaining : lines;
    let sent = pending ? pending.sent : 0;
    try {
      if (!batchId) {
        ref = makeRef();
        const bf = {[B.ref]: ref, [B.by]: reqBy, [B.email]: email, [B.dept]: dept, [B.count]: lines.length, [B.type]: c.sap};
        if ($("#notes").value.trim()) bf[B.notes] = $("#notes").value.trim();
        const res = await mcp.callTool(AT, "create_records_for_table", {baseId: BASE, tableId: T_BATCH, records: [{fields: bf}]});
        batchId = idsFrom(res)[0];
        if (!batchId) throw {code: "tool_error", message: "The request header was saved but Airtable did not return its record ID."};
      }
      for (let i = 0; i < toSend.length; i += 50) {
        const chunk = toSend.slice(i, i + 50);
        const records = chunk.map(o => {
          const f = {[L.type]: c.sap, [L.by]: reqBy, [L.email]: email, [L.date]: today(), [L.status]: "Submitted", [L.batch]: [batchId]};
          c.keys.forEach(k => { if (o[k]) f[L[k]] = o[k]; });
          return {fields: f};
        });
        try { await mcp.callTool(AT, "create_records_for_table", {baseId: BASE, tableId: T_LINE, records}); sent += chunk.length; }
        catch (err) { pending = {batchId, ref, remaining: toSend.slice(i), sent}; throw err; }
      }
      pending = null; resetSubmit();
      $("#hdrRef").textContent = ref;
      banner("ok", `<h3>تم الإرسال</h3><p class="ref">${esc(ref)}</p><p>${plural(sent)} (<span class="ltr">${esc(c.sap)}</span>). تُكتب أكواد SAP في الطلب بعد المراجعة والإنشاء.</p><div class="row-actions" style="margin-top:6px"><button type="button" id="newReq">بدء طلب جديد</button></div>`);
      $("#newReq").addEventListener("click", () => { resetForm(true); banner(null); $("#hdrRef").textContent = "يصدر عند الإرسال"; window.scrollTo(0, 0); });
      store[type] = null; try { localStorage.removeItem(DRAFT); } catch (_) {}
    } catch (err) {
      const partial = pending && pending.batchId
        ? `<p>تم إنشاء الطلب <b class="ltr">${esc(pending.ref)}</b> بعدد ${pending.sent} من ${pending.sent + pending.remaining.length} سطور. اضغط <b>إرسال السطور المتبقية</b> لإضافة الباقي لنفس الطلب.</p>` : "";
      banner("error", `<h3>لم يتم الإرسال</h3><p>${errText(err)}</p>${partial}`);
      if (!pending) resetSubmit(); else submitBtn.textContent = "إرسال السطور المتبقية";
    } finally { submitBtn.disabled = false; }
  });

  { const d = new Date(), z = n => String(n).padStart(2, "0"); $("#hdrDate").textContent = `${z(d.getDate())}/${z(d.getMonth()+1)}/${d.getFullYear()}`; }
  loadDraft();
})();
</script>

</body>
</html>
